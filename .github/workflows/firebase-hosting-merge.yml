name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pin Node: 24.17.0 introduced an http.Agent keep-alive regression that breaks
          # firebase-tools' OAuth token exchange (ERR_STREAM_PREMATURE_CLOSE; nodejs/node#63989,
          # also affects 22.23.0). 24.16.0 is the last unaffected release — revisit once a
          # fixed patch is confirmed.
          node-version: "24.16.0"
      - name: Deploy to Firebase Hosting (live channel)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRIVATE_340410 }}
        run: |
          set -euo pipefail
          SA="$RUNNER_TEMP/firebase-sa.json"
          # The secret may be raw JSON or base64-encoded JSON; handle both.
          if [ "${FIREBASE_SERVICE_ACCOUNT:0:1}" = "{" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$SA"
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          npx --yes firebase-tools@latest deploy --only hosting --project private-340410 --non-interactive
